name: aws_nodegroup
type: aws_nodegroup
provider: aws
version: 1.0.0
resources:
    - aws_autoscaling_group_tag.node_group
    - aws_eks_node_group.node_group
    - aws_iam_role.node_group
    - aws_iam_role_policy_attachment.node_group_AmazonEC2ContainerRegistryReadOnly
    - aws_iam_role_policy_attachment.node_group_AmazonEKSWorkerNodePolicy
    - aws_iam_role_policy_attachment.node_group_AmazonEKS_CNI_Policy
    - random_id.key_suffix
data:
    - data.aws_eks_cluster.main
    - data.aws_iam_policy_document.node_group
    - data.aws_region.current
inputs:
    - default: AL2023_x86_64_STANDARD
      name: ami_type
      required: false
      type: string
    - default: {}
      name: autoscaling_tags
      required: false
      type: map(string)
    - description: Env name
      name: env_name
      required: true
      type: string
    - name: k8s_cluster_name
      required: true
      type: string
    - default: {}
      name: labels
      required: false
      type: map(string)
    - description: Layer name
      name: layer_name
      required: true
      type: string
    - default: 15
      name: max_nodes
      required: false
      type: number
    - default: 3
      name: min_nodes
      required: false
      type: number
    - description: Module name
      name: module_name
      required: true
      type: string
    - default: 20
      name: node_disk_size
      required: false
      type: number
    - default: t3.medium
      name: node_instance_type
      required: false
      type: string
    - default: false
      name: spot_instances
      required: false
      type: bool
    - default: []
      name: taints
      required: false
      type: list(map(string))
    - default: false
      name: use_gpu
      required: false
      type: bool
