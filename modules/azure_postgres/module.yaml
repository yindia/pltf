name: azure_postgres
type: azure_postgres
provider: azure
version: 1.0.0
capabilities:
    provides:
        - secret
resources:
    - azurerm_postgresql_configuration.connection_throttling
    - azurerm_postgresql_configuration.log_checkpoints
    - azurerm_postgresql_configuration.log_connections
    - azurerm_postgresql_configuration.log_disconnections
    - azurerm_postgresql_configuration.log_duration
    - azurerm_postgresql_configuration.log_retention_days
    - azurerm_postgresql_database.pltf
    - azurerm_postgresql_server.pltf
    - azurerm_private_endpoint.pltf
    - random_id.key_suffix
    - random_password.root_auth
data:
    - data.azurerm_resource_group.main
    - data.azurerm_subnet.pltf
inputs:
    - default: "11"
      name: engine_version
      required: false
      type: string
    - description: Env name
      name: env_name
      required: true
      type: string
    - description: Layer name
      name: layer_name
      required: true
      type: string
    - description: Module name
      name: module_name
      required: true
      type: string
    - default: GP_Gen5_2
      name: sku_name
      required: false
      type: string
outputs:
    - name: db_host
      type: string
    - name: db_name
      type: string
    - name: db_password
      type: string
      capability: secret
    - name: db_user
      type: string
