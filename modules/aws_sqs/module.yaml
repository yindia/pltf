name: aws_sqs
type: aws_sqs
provider: aws
version: 1.0.0
resources:
    - aws_kms_key.key
    - aws_sqs_queue.terraform_queue
    - aws_sqs_queue_policy.default
data:
    - data.aws_caller_identity.current
    - data.aws_iam_policy_document.kms_policy
    - data.aws_iam_policy_document.sqs_queue_policy
inputs:
    - default: false
      name: content_based_deduplication
      required: false
      type: bool
    - default: 0
      name: delay_seconds
      required: false
      type: number
    - description: Env name
      name: env_name
      required: true
      type: string
    - default: false
      name: fifo
      required: false
      type: bool
    - description: Layer name
      name: layer_name
      required: true
      type: string
    - default: 345600
      name: message_retention_seconds
      required: false
      type: number
    - description: Module name
      name: module_name
      required: true
      type: string
    - default: 0
      name: receive_wait_time_seconds
      required: false
      type: number
outputs:
    - name: kms_arn
      type: string
    - name: queue_arn
      type: string
    - name: queue_id
      type: string
    - name: queue_name
      type: string
