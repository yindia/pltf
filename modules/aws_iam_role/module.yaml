name: aws_iam_role
type: aws_iam_role
provider: aws
version: 1.0.0
capabilities:
    provides:
        - iam.role
    accepts:
        - iam.policy
        - iam.trusts
resources:
    - aws_iam_policy.vanilla_policy
    - aws_iam_role.role
    - aws_iam_role_policy.pass_role_to_self
    - aws_iam_role_policy_attachment.extra_policies_attachment
    - aws_iam_role_policy_attachment.vanilla_role_attachment
data:
    - data.aws_iam_policy_document.iam_trusts
    - data.aws_iam_policy_document.pass_role_to_self
inputs:
    - default: []
      name: allowed_iams
      required: false
      type: list(string)
    - default: []
      description: allowed kubernetes services
      name: allowed_k8s_services
      required: false
      type: any
    - description: Env name
      name: env_name
      required: true
      type: string
    - default: []
      name: extra_iam_policies
      required: false
      type: list(string)
    - default: null
      description: iam policy
      name: iam_policy
      required: false
      type: any
    - default: []
      name: kubernetes_trusts
      required: false
      type: |-
        list(object({
            open_id_url  = string
            open_id_arn  = string
            service_name = string
            namespace    = string
          }))
    - description: Layer name
      name: layer_name
      required: true
      type: string
    - default: []
      description: Links for module
      name: links
      required: false
      type: any
    - description: Module name
      name: module_name
      required: true
      type: string
outputs:
    - name: role_arn
      type: string
