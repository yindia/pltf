name: aws_sns
type: aws_sns
provider: aws
version: 1.0.0
resources:
    - aws_kms_key.key
    - aws_sns_topic.topic
    - aws_sns_topic_policy.default
    - aws_sns_topic_subscription.user_updates_sqs_target
data:
    - data.aws_caller_identity.current
    - data.aws_iam_policy_document.kms_policy
    - data.aws_iam_policy_document.sns_topic_policy
inputs:
    - default: false
      name: content_based_deduplication
      required: false
      type: bool
    - description: Env name
      name: env_name
      required: true
      type: string
    - default: false
      name: fifo
      required: false
      type: bool
    - description: Layer name
      name: layer_name
      required: true
      type: string
    - description: Module name
      name: module_name
      required: true
      type: string
    - default: []
      name: sqs_subscribers
      required: false
      type: list(string)
outputs:
    - name: kms_arn
      type: string
    - name: topic_arn
      type: string
