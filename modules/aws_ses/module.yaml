name: aws_ses
type: aws_ses
provider: aws
version: 1.0.0
resources:
    - aws_iam_policy.sender
    - aws_route53_record.amazonses_dkim_record
    - aws_route53_record.amazonses_verification_record
    - aws_route53_record.ses_domain_mail_from_mx
    - aws_route53_record.ses_domain_mail_from_txt
    - aws_ses_domain_dkim.dkim
    - aws_ses_domain_identity.email
    - aws_ses_domain_identity_verification.example_verification
    - aws_ses_domain_mail_from.email
data:
    - data.aws_iam_policy_document.sender
    - data.aws_region.current
inputs:
    - name: domain
      required: true
      type: string
    - description: Env name
      name: env_name
      required: true
      type: string
    - description: Layer name
      name: layer_name
      required: true
      type: string
    - default: mail
      name: mail_from_prefix
      required: false
      type: string
    - description: Module name
      name: module_name
      required: true
      type: string
    - name: zone_id
      required: true
      type: string
outputs:
    - name: identity_arn
      type: string
    - name: sender_policy_arn
      type: string
