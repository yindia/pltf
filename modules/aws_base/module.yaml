name: aws_base
type: aws_base
provider: aws
version: 1.0.0
resources:
    - aws_cloudwatch_log_group.vpc_flow_log
    - aws_db_subnet_group.main
    - aws_default_security_group.default
    - aws_docdb_subnet_group.main
    - aws_ebs_encryption_by_default.default
    - aws_eip.nat_eips
    - aws_elasticache_subnet_group.main
    - aws_flow_log.vpc
    - aws_iam_role.vpc_flow_log
    - aws_iam_role_policy.vpc_flow_log
    - aws_iam_service_linked_role.autoscaling
    - aws_internet_gateway.igw
    - aws_kms_alias.alias
    - aws_kms_key.key
    - aws_nat_gateway.nat_gateways
    - aws_route.nat_routes
    - aws_route_table.private_route_tables
    - aws_route_table.public_route_table
    - aws_route_table_association.private_associations
    - aws_route_table_association.public_association
    - aws_s3_bucket.log_bucket
    - aws_s3_bucket_acl.log_bucket
    - aws_s3_bucket_lifecycle_configuration.log_bucket
    - aws_s3_bucket_ownership_controls.log_bucket
    - aws_s3_bucket_policy.log_bucket_policy
    - aws_s3_bucket_public_access_block.log_bucket
    - aws_s3_bucket_server_side_encryption_configuration.log_bucket
    - aws_s3_bucket_versioning.log_bucket
    - aws_security_group.db
    - aws_security_group.documentdb
    - aws_security_group.elasticache
    - aws_subnet.private_subnets
    - aws_subnet.public_subnets
    - aws_vpc.vpc
    - aws_vpc_endpoint.s3
    - aws_vpc_endpoint_route_table_association.s3
    - random_id.bucket_suffix
    - random_id.vpc_flow_log_suffix
data:
    - data.aws_availability_zones.current
    - data.aws_caller_identity.current
    - data.aws_iam_policy_document.kms_policy
    - data.aws_iam_policy_document.log_bucket_policy
    - data.aws_region.current
    - data.aws_route_table.private_subnet_routes
    - data.aws_subnet.private_subnets
    - data.aws_subnet.public_subnets
    - data.aws_vpc.vpc
inputs:
    - default: null
      description: Cluster name used for Kubernetes tagging
      name: cluster_name
      required: false
      type: string
    - default: false
      description: Whether to tag subnets for Karpenter discovery
      name: enable_karpenter
      required: false
      type: bool
    - description: Env name
      name: env_name
      required: true
      type: string
    - description: Layer name
      name: layer_name
      required: true
      type: string
    - description: Module name
      name: module_name
      required: true
      type: string
    - default:
        - 10.0.128.0/21
        - 10.0.136.0/21
        - 10.0.144.0/21
      description: Cidr blocks for private subnets. One for each desired AZ
      name: private_ipv4_cidr_blocks
      required: false
      type: list(string)
    - default: null
      description: List of pre-existing private subnets to use instead of creating new subnets for pltf. Required when var.vpc_id is set.
      name: private_subnet_ids
      required: false
      type: list(string)
    - default:
        - 10.0.0.0/21
        - 10.0.8.0/21
        - 10.0.16.0/21
      description: Cidr blocks for public subnets. One for each desired AZ
      name: public_ipv4_cidr_blocks
      required: false
      type: list(string)
    - default: null
      description: List of pre-existing public subnets to use instead of creating new subnets for pltf. Required when var.vpc_id is set.
      name: public_subnet_ids
      required: false
      type: list(string)
    - default: false
      description: Whether instances launched in public subnets receive a public IP by default.
      name: public_subnet_map_public_ip_on_launch
      required: false
      type: bool
    - default: 10.0.0.0/16
      description: Cidr block to reserve for whole vpc
      name: total_ipv4_cidr_block
      required: false
      type: string
    - default: null
      description: The ID of an pre-existing VPC to use instead of creating a new VPC for pltf
      name: vpc_id
      required: false
      type: string
    - default: 90
      name: vpc_log_retention
      required: false
      type: number
outputs:
    - name: db_aws_security_group
      type: string
    - name: documentdb_aws_security_group
      type: string
    - name: elasticache_aws_security_group
      type: string
    - name: kms_account_key_arn
      type: string
    - name: kms_account_key_id
      type: string
    - name: kms_key_alias
      type: string
    - name: private_subnet_ids
      type: string
    - name: public_nat_ips
      type: string
    - name: public_subnets_ids
      type: string
    - name: s3_log_bucket_name
      type: string
    - name: vpc_id
      type: string
