name: gcp_service_account
type: gcp_service_account
provider: gcp
version: 1.0.0
resources:
    - google_project_iam_member.project
    - google_service_account.k8s_service
    - google_service_account_iam_binding.trust_k8s_workload_idu
    - google_storage_bucket_iam_member.bucket_get
    - google_storage_bucket_iam_member.bucket_viewer
    - google_storage_bucket_iam_member.viewer
    - random_string.suffix
data:
    - data.google_client_config.current
    - data.google_container_registry_repository.root
inputs:
    - default: []
      name: additional_iam_roles
      required: false
    - default: []
      name: allowed_k8s_services
      required: false
    - description: Env name
      name: env_name
      required: true
      type: string
    - default: null
      name: explicit_name
      required: false
      type: string
    - description: Layer name
      name: layer_name
      required: true
      type: string
    - default: []
      name: links
      required: false
    - description: Module name
      name: module_name
      required: true
      type: string
    - default: []
      name: read_buckets
      required: false
      type: list(string)
    - default: []
      name: write_buckets
      required: false
      type: list(string)
outputs:
    - name: service_account_email
      type: string
    - name: service_account_id
      type: string
