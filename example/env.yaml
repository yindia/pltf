apiVersion: platform.io/v1
kind: Environment
gitProvider: github
metadata:
  name: example-aws
  org: pltf
  provider: aws
  labels:
    team: platform
    cost_center: shared
  stacks:
    - ./stacks/k8s-cluster.yaml
    - ./stacks/k8s-nodegroup.yaml
images:
  - name: platform-tools
    context: .
    dockerfile: Dockerfile
    tags:
      - ghcr.io/example/platform-tools:${env_name}
    buildArgs:
      ENV: ${env_name}
environments:
  dev:
    account: "556169302489"
    region: ap-northeast-1
  stage:
    account: "556169302489"
    region: ap-northeast-1
  prod:
    account: "556169302489"
    region: ap-northeast-1
modules:
  - id: nodegroupgggg
    type: aws_nodegroup
    inputs:
      max_nodes: 15
      node_disk_size: 20
